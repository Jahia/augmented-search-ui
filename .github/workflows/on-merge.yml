# This workflow is triggered every time a change is pushed to any branches
# Github actions command reference: https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
name: On merge to main

# The workflow could also be triggered on PRs
on:
  push:
    branches:
      - "main"
    tags-ignore:
      - "**"

jobs:
  build:
    name: Build Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise build

  # Publishes target/augmented-search-ui-v<version>.tgz to the Nexus repository declared in
  # package.json under jahia.maven.distributionManagement.
  publish:
    name: Publish module
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jahia/jahia-docker-mvn-cache:8-jdk-noble-mvn-loaded
      credentials:
        username: ${{ secrets.GH_PACKAGES_USERNAME }}
        password: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # publish-javascript builds the package itself and calls actions/setup-node internally, so mise
      # cannot drive it: node_version is pinned to the same major as mise.toml instead.
      - uses: jahia/jahia-modules-action/publish-javascript@v2
        with:
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          node_version: 26
