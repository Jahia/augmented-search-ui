# This workflow is triggered every time a change is pushed to any branches
# Github actions command reference: https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
name: On Code Change (PR)

# The workflow could also be triggered on PRs
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  static-analysis:
    name: Static Analysis (linting, vulns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: yarn install
      - run: yarn lint
      - name: Scan javascript vulnerabilities
        run: npx audit-ci --skip-dev --critical

  build:
    name: Build Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise build

      - name: Move the package to target/
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r 'if (.jahia.snapshot == true) or (.version | endswith("-SNAPSHOT"))
                           then (.version | sub("-SNAPSHOT$";"")) + "-SNAPSHOT"
                           else .version end' package.json)
          mkdir -p target
          mv dist/package.tgz "target/${name}-v${version}.tgz"
          ls -l target/

      - uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: target/*.tgz
          retention-days: 2

  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAHIA_LICENSE: ${{ secrets.JAHIA_LICENSE }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build, start and provision the environment
        run: mise start

      - name: Run the Playwright suite
        run: mise test

      - name: Collect container logs
        if: always()
        run: |
          mkdir -p tests/results
          docker compose logs --no-color --timestamps --tail=all > tests/results/containers.log 2>&1 || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: tests/results
          retention-days: 7
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: mise delete || true
